name: recovery-probe

# Temporary: recovery journeys (fail, restart, close and reopen, process killed, onboarding queue)
# through the real main window on IRIS and Caché, for the private code before and after its
# recovery changes, plus the full suites on the changed code with any failure rerun on the code
# before them. Output withheld from this public log; filed as issues in the private repository.
on:
  push:
    branches: [claude/recovery-probe]

permissions:
  contents: read

env:
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  QT_QPA_PLATFORM: offscreen
  BEFORE_REF: claude/rj-before
  AFTER_REF: claude/rj-after

jobs:
  probe:
    name: probe ${{ matrix.source }} ${{ matrix.code }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        source: [iris, cache]
        code: [before, after]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.RUNNER_PAT }}
          ref: ${{ matrix.code == 'before' && env.BEFORE_REF || env.AFTER_REF }}
          path: private
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencies (output withheld)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/results"
          {
            sudo apt-get update
            sudo apt-get install -y curl ca-certificates libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 unixodbc unixodbc-dev
            curl -sSL -o /tmp/packages-microsoft-prod.deb https://packages.microsoft.com/config/ubuntu/24.04/packages-microsoft-prod.deb
            sudo dpkg -i /tmp/packages-microsoft-prod.deb
            sudo apt-get update
            sudo env ACCEPT_EULA=Y apt-get install -y msodbcsql18
            python -m pip install -r private/requirements-dev.txt pytest-timeout intersystems-irispython
          } > "$RUNNER_TEMP/results/deps-setup.log" 2>&1
          echo "dependencies installed"
      - name: Servers and probe (output withheld)
        working-directory: private
        run: |
          set +e
          R="$RUNNER_TEMP/results"
          cp ci-live/recovery_probe.py verify/test_zz_recovery_probe.py
          if [ "${{ matrix.source }}" = iris ]; then
            sudo -E env "PATH=$PATH" RUNTIME_REPO="$PWD/ci-live/runtime" UDX_FILE="$PWD/IrisWorkbenchUpdate/cache/UDX.int" \
              ENV_FILE=/tmp/wb.env bash ci/test-runner/iris-docker-local.sh > "$R/iris-setup.log" 2>&1
            plugin=""
          else
            sudo -E env "PATH=$PATH" ENV_FILE=/tmp/wb.env bash ci/test-runner/cache-docker-local.sh > "$R/cache-setup.log" 2>&1
            bash ci-live/cache_runtime_load.sh "$PWD/ci-live/runtime" > "$R/cache-runtime-load.txt" 2>&1
            plugin="-p cache_unixodbc"
          fi
          sudo chmod 644 /tmp/wb.env
          . /tmp/wb.env
          export RECOVERY_OUT="$R/probe.jsonl"
          timeout -k 60 7200 python -m pytest verify/test_zz_recovery_probe.py $plugin -q -p no:cacheprovider -rfEs \
            --timeout=2400 > "$R/probe-pytest.txt" 2>&1
          echo "finished (output withheld)"
          exit 0
      - name: File the results in the private repository
        if: always()
        working-directory: private
        env:
          RUNNER_PAT: ${{ secrets.RUNNER_PAT }}
          PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
        run: |
          R="$RUNNER_TEMP/results"
          extra=""; [ -f "$R/cache-runtime-load.txt" ] && extra="$R/cache-runtime-load.txt"
          python ci-live/post_files.py "Recovery probe: ${{ matrix.source }} ${{ matrix.code }}" \
            "$R/probe.jsonl" "$R/probe-pytest.txt" $extra > /dev/null 2>&1 || echo "post failed"
          echo "filed"

  suites:
    name: suite ${{ matrix.job }} after
    runs-on: ubuntu-24.04
    timeout-minutes: 200
    strategy:
      fail-fast: false
      matrix:
        job: [offline, iris, cache]
    steps:
      - name: Check out the changed code
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.RUNNER_PAT }}
          ref: ${{ env.AFTER_REF }}
          path: private
          fetch-depth: 1
          persist-credentials: false
      - name: Check out the code before the changes
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.RUNNER_PAT }}
          ref: ${{ env.BEFORE_REF }}
          path: before
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencies (output withheld)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/results"
          {
            sudo apt-get update
            sudo apt-get install -y curl ca-certificates libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 unixodbc unixodbc-dev
            curl -sSL -o /tmp/packages-microsoft-prod.deb https://packages.microsoft.com/config/ubuntu/24.04/packages-microsoft-prod.deb
            sudo dpkg -i /tmp/packages-microsoft-prod.deb
            sudo apt-get update
            sudo env ACCEPT_EULA=Y apt-get install -y msodbcsql18
            python -m pip install -r private/requirements-dev.txt pytest-timeout intersystems-irispython
          } > "$RUNNER_TEMP/results/deps-setup.log" 2>&1
          echo "SHA=$(git -C private rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "dependencies installed"
      - name: Run the suite (output withheld)
        working-directory: private
        run: |
          set +e
          R="$RUNNER_TEMP/results"
          extra=""
          case "${{ matrix.job }}" in
            offline)
              python -m pytest verify IrisWorkbenchUpdate/tests -q -p no:cacheprovider -rfEs --timeout=600 \
                --junitxml="$R/offline-junit.xml" > "$R/offline.log" 2>&1
              ;;
            iris)
              sudo -E env "PATH=$PATH" RUNTIME_REPO="$PWD/ci-live/runtime" UDX_FILE="$PWD/IrisWorkbenchUpdate/cache/UDX.int" \
                ENV_FILE=/tmp/wb.env bash ci/test-runner/iris-docker-local.sh > "$R/iris-setup.log" 2>&1
              sudo chmod 644 /tmp/wb.env
              . /tmp/wb.env
              timeout -k 60 7200 python -m pytest verify IrisWorkbenchUpdate/tests -q -p no:cacheprovider -rfEs \
                --timeout=900 --junitxml="$R/iris-junit.xml" > "$R/iris.log" 2>&1
              ;;
            cache)
              sudo -E env "PATH=$PATH" ENV_FILE=/tmp/wb.env bash ci/test-runner/cache-docker-local.sh > "$R/cache-setup.log" 2>&1
              bash ci-live/cache_runtime_load.sh "$PWD/ci-live/runtime" > "$R/cache-runtime-load-setup.log" 2>&1
              sudo chmod 644 /tmp/wb.env
              . /tmp/wb.env
              extra="-p cache_unixodbc"
              timeout -k 60 7200 python -m pytest $extra verify IrisWorkbenchUpdate/tests -q -p no:cacheprovider -rfEs \
                --timeout=600 --deselect "verify/test_cache_source.py::test_k5_the_cache_source_reads_a_real_intersystems_server_over_odbc" \
                --junitxml="$R/cache-junit.xml" > "$R/cache.log" 2>&1
              ;;
          esac
          for j in "$R"/*-junit.xml; do
            [ -f "$j" ] || continue
            name=$(basename "$j" -junit.xml)
            python ci-live/rerun_on_main.py "$j" "$GITHUB_WORKSPACE/before" "$R/$name-vs-main.txt" $extra --timeout=900 > /dev/null 2>&1
          done
          echo "suite finished (output withheld)"
          exit 0
      - name: File the results as an issue in the private repository
        if: always()
        working-directory: private
        env:
          RUNNER_PAT: ${{ secrets.RUNNER_PAT }}
          PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
        run: python ci-live/report_issue.py "${{ matrix.job }} after (failures rerun on the code before)" "$RUNNER_TEMP/results" 2> "$RUNNER_TEMP/report-error.txt" || echo "report failed"
